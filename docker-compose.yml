# ---------------------------------------------------------------------------
# Database only.
#
# The Nest app runs on your machine with `npm run start:dev`; Docker just hosts
# PostgreSQL so no local PostgreSQL install is needed.
#
#   1. cp .env.example .env
#   2. docker compose up -d --wait   (--wait blocks until Postgres is healthy)
#   3. npm run start:dev
#   4. curl http://localhost:3000/tasks
#
# Compose reads `.env` from this directory automatically and substitutes the
# ${VAR} references below, so the credentials only ever live in one file.
# Defaults are supplied via ${VAR:-default} so the database still boots if you
# never create a `.env`.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # These map onto the Postgres image's own bootstrap variables. It only
      # applies them when the data directory is first initialised, which is why
      # changing DB_PASSWORD later has no effect unless you delete the volume.
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-task}
    ports:
      # HOST_PORT:CONTAINER_PORT. Postgres always listens on 5432 inside the
      # container; the host side is ${DB_PORT} so the app running on your
      # machine can reach it. It defaults to 5433 because a local PostgreSQL
      # install commonly owns 5432 already, which makes the bind fail with
      # "port is already allocated". Set DB_PORT=5432 if that port is free.
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Named volume keeps your data across `docker compose down`. Run
      # `docker compose down -v` to wipe it and start from a clean database.
      - task-db-data:/var/lib/postgresql/data
    healthcheck:
      # TypeORM connects and runs `synchronize` on app boot, so the app needs
      # Postgres to already be accepting connections. `docker compose up -d
      # --wait` blocks until this reports healthy, which is what keeps the
      # first `npm run start:dev` from failing with ECONNREFUSED.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-task}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  task-db-data: